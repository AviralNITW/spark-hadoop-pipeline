services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_namenode_rpc_address=0.0.0.0:9000
      - HDFS_CONF_dfs_namenode_name_dir=file:///hadoop/dfs/name
    ports:
      - "9870:9870"
      - "9000:9000"
      
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
    depends_on:
      - namenode
    ports:
      - "9864:9864"
      
  spark:
    image: apache/spark:3.5.0
    container_name: spark
    depends_on:
      - namenode
      - datanode  
    tty: true
    stdin_open: true
    command: tail -f /dev/null
    volumes: 
      - ./jars/:/extrajars
      - ./data:/data
      - /home/tushar/big_data/hadoop-3.3.6/etc/hadoop:/opt/hadoop/etc/hadoop
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop-3.2.1/etc/hadoop
      - SPARK_HOME=/opt/spark
      
  postgres:
    image: postgres:13
    container_name: HiveMetastoreDB_postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5432:5432"
      
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    environment:
      - SERVICE_NAME=metastore
      # Postgres connection details jo Derby ko replace karenge
      - DB_DRIVER=postgres
      - HIVE_DB_JDBC_URL=jdbc:postgresql://HiveMetastoreDB_postgres:5432/metastore
      - HIVE_DB_USER=hive
      - HIVE_DB_PASSWORD=hive
    ports:
      - "9083:9083"
    volumes:
      - ./data/hive-site.xml:/opt/hive/conf/hive-site.xml
    depends_on:
      - postgres
      
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    environment:
      - CLUSTER_NAME=test
    ports:
      - "8088:8088"
  
  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    environment:
      - CLUSTER_NAME=test
    depends_on:
      - resourcemanager
